# Source: uvp bootstrap update fixture
# Source tag: uvp 0.1.3
# Purpose: local Anvil self-bootstrap fixture for uvp-eth.
apiVersion: uvp/v0
kind: Zhixu
metadata:
  name: uvp-bootstrap-update-v2
  annotations:
    version: "2"
# 说明（元数据 note 字段已随 deny_unknown_fields 裁撤，正文移入注释）：
# UVP 自举更新秩序（M1）。
# 目标：通过 registrar 的跨源入口信号触发后完成
# init/audit/prepare/build/deploy/verify/switch/cleanup。
# 任意关键阶段失败后进入 rollback。
spec:
  platform:
    type: blockchain
    provider: eth
    network: base
    version: "0.1.3"
  nucleation:
    id: uvp-bootstrap
  taskPatterns:
    - name: intake
      stages:
        - name: submission
          # 注册提交的落点：bootstrap 域发出 submitted 事实，作为 init 的
          # 出生订阅源（订阅类必须等于目标阶段 source，且不等于接收方）。
          source: bootstrap
          sendSignals: ["submitted"]
          executor:
            supplierID: "{{ .update_init_executor_uid }}"
            supplierType: individual
    - name: update
      stages:
        - name: init
          source: registrar
          # 出生阶段（mint）：订阅 bootstrap 域的注册提交事实即出生
          # （triggerOrderFromOutsideFor），链上 isTrigger 出生钩子；出生
          # 只接受订阅通道，ANCHOR 编译为单条 SIGNAL 指令。
          mint: per-fact
          receiveSignals:
            TRIGGER: "::ANCHOR(@bootstrap::intake.submission.submitted)"
          sendSignals: ["trigger", "str", "cmp", "err"]
          fileResources:
            update_spec:
              fileType: local
              localFile:
                path: "./bootstrap/update/update_spec.sample.json"
          executor:
            supplierID: "{{ .update_init_executor_uid }}"
            supplierType: individual

        - name: audit
          source: bootstrap
          receiveSignals:
            init_done: "registrar::update.init.cmp"
          sendSignals: ["str", "pass", "reject", "cmp", "err"]
          executor:
            supplierID: "{{ .update_audit_executor_uid }}"
            supplierType: individual

        - name: prepare
          source: bootstrap
          receiveSignals:
            audit_pass: "bootstrap::update.audit.pass"
          sendSignals: ["str", "cmp", "err"]
          executor:
            supplierID: "{{ .update_prepare_executor_uid }}"
            supplierType: individual

        - name: build
          source: bootstrap
          receiveSignals:
            prepare_done: "bootstrap::update.prepare.cmp"
          sendSignals: ["str", "cmp", "err"]
          executor:
            supplierID: "{{ .update_build_executor_uid }}"
            supplierType: individual

        - name: deploy
          source: bootstrap
          receiveSignals:
            build_done: "bootstrap::update.build.cmp"
          sendSignals: ["str", "cmp", "err"]
          executor:
            supplierID: "{{ .update_deploy_executor_uid }}"
            supplierType: individual

        - name: verify
          source: bootstrap
          receiveSignals:
            deploy_done: "bootstrap::update.deploy.cmp"
          sendSignals: ["str", "pass", "fail", "cmp", "err"]
          executor:
            supplierID: "{{ .update_verify_executor_uid }}"
            supplierType: individual

        - name: switch
          source: bootstrap
          receiveSignals:
            verify_pass: "bootstrap::update.verify.pass"
          sendSignals: ["str", "cmp", "err"]
          executor:
            supplierID: "{{ .update_switch_executor_uid }}"
            supplierType: individual

        - name: cleanup
          source: bootstrap
          receiveSignals:
            switch_done: "bootstrap::update.switch.cmp"
          sendSignals: ["str", "cmp", "err"]
          executor:
            supplierID: "{{ .update_cleanup_executor_uid }}"
            supplierType: individual

        - name: rollback
          source: bootstrap
          receiveSignals:
            prepare_failure: "bootstrap::update.prepare.err"
            build_failure: "bootstrap::update.build.err"
            deploy_failure: "bootstrap::update.deploy.err"
            verify_failure: "bootstrap::update.verify.fail"
            verify_error: "bootstrap::update.verify.err"
          sendSignals: ["str", "cmp", "err"]
          executor:
            supplierID: "{{ .update_rollback_executor_uid }}"
            supplierType: individual
