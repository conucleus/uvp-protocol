# Source: uvp bootstrap update fixture
# Source tag: uvp 0.1.3
# Purpose: local Anvil self-bootstrap fixture for uvp-eth.
apiVersion: uvp/v0
kind: Zhixu
metadata:
  name: uvp-bootstrap-update-v2
# 说明（元数据 note 字段已随 deny_unknown_fields 裁撤，正文移入注释）：
# UVP 自举更新秩序（M1）。
# 目标：通过 registrar 的跨源入口信号触发后完成
# init/audit/prepare/build/deploy/verify/switch/cleanup。
# 任意关键阶段失败后进入 rollback。
spec:
  platform:
    type: blockchain
    provider: eth
    network: base
    version: "0.1.3"
  nucleation:
    id: uvp-bootstrap
  stages:
    - name: submission
      # 注册提交的落点：bootstrap 域发出 submitted 事实（普通业务事实）。
      # PUBLISH 为自发种子入口钩子（物化门：零 hook 阶段在链上永不可
      # 物化、sendSignals 无钩子可挂）。
      source: bootstrap
      receiveSignals:
        PUBLISH: "bootstrap::submission.seed"
      sendSignals: [{ name: "submitted" }, { name: "seed" }]
      executor:
        supplierID: "0a000000-0000-4000-8000-000000000001"
        supplierType: individual

    - name: init
      source: registrar
      # 出生阶段（trigger）：空 oid + trigger 信号即建单
      # （triggerOrderFromOutsideFor）；该信号编译为 order-trigger 出生钩子
      # （MINT 位，emitReady=true），出生事实为 registrar::init.trigger。
      sendSignals: [{ name: "trigger", trigger: true }, { name: "str" }, { name: "cmp" }, { name: "err" }]
      fileResources:
        update_spec:
          fileType: local
          localFile:
            path: "./bootstrap/update/update_spec.sample.json"
      executor:
        supplierID: "0a000000-0000-4000-8000-000000000001"
        supplierType: individual

    - name: audit
      source: bootstrap
      receiveSignals:
        init_done: "registrar::init.cmp"
      sendSignals: [{ name: "str" }, { name: "pass" }, { name: "reject" }, { name: "cmp" }, { name: "err" }]
      executor:
        supplierID: "0a000000-0000-4000-8000-000000000002"
        supplierType: individual

    - name: prepare
      source: bootstrap
      receiveSignals:
        audit_pass: "bootstrap::audit.pass"
      sendSignals: [{ name: "str" }, { name: "cmp" }, { name: "err" }]
      executor:
        supplierID: "0a000000-0000-4000-8000-000000000003"
        supplierType: individual

    - name: build
      source: bootstrap
      receiveSignals:
        prepare_done: "bootstrap::prepare.cmp"
      sendSignals: [{ name: "str" }, { name: "cmp" }, { name: "err" }]
      executor:
        supplierID: "0a000000-0000-4000-8000-000000000004"
        supplierType: individual

    - name: deploy
      source: bootstrap
      receiveSignals:
        build_done: "bootstrap::build.cmp"
      sendSignals: [{ name: "str" }, { name: "cmp" }, { name: "err" }]
      executor:
        supplierID: "0a000000-0000-4000-8000-000000000005"
        supplierType: individual

    - name: verify
      source: bootstrap
      receiveSignals:
        deploy_done: "bootstrap::deploy.cmp"
      sendSignals: [{ name: "str" }, { name: "pass" }, { name: "fail" }, { name: "cmp" }, { name: "err" }]
      executor:
        supplierID: "0a000000-0000-4000-8000-000000000006"
        supplierType: individual

    - name: switch
      source: bootstrap
      receiveSignals:
        verify_pass: "bootstrap::verify.pass"
      sendSignals: [{ name: "str" }, { name: "cmp" }, { name: "err" }]
      executor:
        supplierID: "0a000000-0000-4000-8000-000000000007"
        supplierType: individual

    - name: cleanup
      source: bootstrap
      receiveSignals:
        switch_done: "bootstrap::switch.cmp"
      sendSignals: [{ name: "str" }, { name: "cmp" }, { name: "err" }]
      executor:
        supplierID: "0a000000-0000-4000-8000-000000000008"
        supplierType: individual

    - name: rollback
      source: bootstrap
      receiveSignals:
        prepare_failure: "bootstrap::prepare.err"
        build_failure: "bootstrap::build.err"
        deploy_failure: "bootstrap::deploy.err"
        verify_failure: "bootstrap::verify.fail"
        verify_error: "bootstrap::verify.err"
      sendSignals: [{ name: "str" }, { name: "cmp" }, { name: "err" }]
      executor:
        supplierID: "0a000000-0000-4000-8000-000000000009"
        supplierType: individual
